<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEJDRIX HUD V2 - FIXED LOGIN</title>

<style>
:root {
    --fn-blue: #007bff; --fn-yellow: #f4c500; --fn-purple: #8c00ff;
    --fn-dark: #0a0b10; --fn-card: #1b1c26; --fn-text: #ffffff;
    --fn-green: #00ff66; --fn-red: #ff003c; --tt-red: #fe2c55;
}

body {
    margin: 0; background: var(--fn-dark); color: var(--fn-text);
    font-family: 'Burbank Big Condensed', 'Segoe UI', Impact, sans-serif;
    display: flex; justify-content: center; min-height: 100vh;
    padding: 20px; box-sizing: border-box; overflow-x: hidden;
}

/* RIFT POZADÍ */
body::before {
    content: ""; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(circle at 30% 30%, rgba(140, 0, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 70% 70%, rgba(0, 123, 255, 0.1) 0%, transparent 50%), var(--fn-dark);
    animation: rift 25s linear infinite; z-index: -1;
}
@keyframes rift { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* LOGIN SCREEN */
#loginOverlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(10, 11, 16, 0.98); backdrop-filter: blur(12px);
    z-index: 10000; display: flex; justify-content: center; align-items: center;
}
.login-card {
    background: var(--fn-card); padding: 50px; border: 4px solid var(--fn-yellow);
    transform: skewX(-5deg); text-align: center; box-shadow: 0 0 50px rgba(244, 197, 0, 0.4);
}
.login-card h2 { color: var(--fn-yellow); font-size: 42px; margin-bottom: 30px; text-transform: uppercase; font-style: italic; }
.login-card input {
    display: block; width: 300px; padding: 15px; margin: 15px auto;
    background: #000; border: 2px solid #363a4f; color: white; font-size: 18px; outline: none;
}
.login-card button {
    width: 100%; padding: 15px; background: var(--fn-yellow); color: black;
    border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 22px;
}

/* LOADING */
#loadingScreen {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #0c0d12; z-index: 9999; display: none;
    flex-direction: column; justify-content: center; align-items: center;
}
.load-bar-bg { width: 400px; height: 20px; background: #111; border: 3px solid #363a4f; margin-top: 20px; overflow: hidden; }
#loadFill { width: 0%; height: 100%; background: var(--fn-yellow); transition: width 0.1s linear; }

/* MAIN CONTENT */
#main { display: none; width: 100%; max-width: 950px; flex-direction: column; gap: 25px; animation: fadeIn 0.5s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.panel {
    background: linear-gradient(135deg, rgba(27, 28, 38, 0.95), rgba(15, 16, 23, 0.95));
    border: 3px solid #2a2c3d; padding: 25px; transform: skewX(-3deg); border-radius: 6px;
}

/* GAME & CHAT */
.game-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
.canvas-area { background: #000; height: 380px; position: relative; border: 2px solid #333; overflow: hidden; border-radius: 4px; }
#player { width: 44px; height: 44px; background: var(--fn-yellow); position: absolute; border-radius: 6px; display: flex; justify-content: center; align-items: center; font-size: 26px; box-shadow: 0 0 20px var(--fn-yellow); z-index: 10; }
#coin { position: absolute; font-size: 32px; display: none; animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

.chat-box { background: #000; height: 380px; border: 2px solid #333; display: flex; flex-direction: column; border-radius: 4px; }
iframe { flex: 1; border: none; background: transparent; }

/* TEAM */
.team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.card { background: rgba(255,255,255,0.05); padding: 15px; border-left: 5px solid var(--fn-yellow); display: flex; justify-content: space-between; align-items: center; }
.badge { padding: 4px 10px; font-weight: 900; font-size: 12px; border-radius: 3px; text-transform: uppercase; font-style: italic; }

.owner { background: var(--fn-yellow); color: black; }
.mod { background: var(--fn-blue); color: white; }
.scripter { background: var(--fn-purple); color: white; }
.traitor { background: var(--fn-red); color: white; }
</style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h2>🔒 MEJDRIX SYSTEM LOGIN</h2>
        <input type="text" id="userInput" placeholder="UŽIVATELSKÉ JMÉNO">
        <input type="password" id="passInput" placeholder="HESLO">
        <button onclick="checkCredentials()">ODEMKNOUT HUB</button>
        <p id="errorMsg" style="color:var(--fn-red); font-weight:bold; margin-top:15px; text-transform:uppercase;"></p>
    </div>
</div>

<div id="loadingScreen">
    <h1 style="color:var(--fn-yellow); font-style:italic; font-size:35px;">NAČÍTÁNÍ MODULŮ...</h1>
    <div class="load-bar-bg"><div id="loadFill"></div></div>
    <p id="loadStatus" style="margin-top:10px; font-weight:bold; color:#8a8f9e;">PŘIPOJOVÁNÍ K TIKFINITY API...</p>
</div>

<div id="main">
    <div class="panel" style="border-color:var(--tt-red); display:flex; justify-content:space-between; align-items:center;">
        <h1 style="margin:0; font-style:italic; letter-spacing:2px;">🔴 MEJDRIX LIVE HUD V2</h1>
        <div style="background:var(--tt-red); padding:8px 20px; font-weight:900; font-style:italic;">CONNECTED</div>
    </div>

    <div class="panel">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items:center;">
            <span style="color:var(--fn-yellow); font-weight:900; font-size:24px; font-style:italic;">🕹️ TIKTOK PLAYS CONTROL</span>
            <select id="gameMode" style="background:#000; color:white; border:2px solid #363a4f; padding:5px 10px; font-weight:bold;">
                <option value="survival">MEJDRIX SURVIVAL</option>
                <option value="coin">COIN HUNT (MINIGAME)</option>
            </select>
        </div>
        <div class="game-layout">
            <div class="canvas-area" id="stage">
                <div id="player">🤖</div>
                <div id="coin">💰</div>
            </div>
            <div class="chat-box">
                <iframe id="tikChat" src="about:blank"></iframe>
                <div style="padding:8px; display:flex; gap:5px; background:#161720;">
                    <input id="tikKey" placeholder="TikFinity ID / URL" style="flex:1; background:#000; color:white; border:1px solid #363a4f; padding:5px;">
                    <button onclick="updateTikFinity()" style="background:var(--fn-yellow); border:none; padding:5px 15px; font-weight:bold; cursor:pointer;">ULOŽIT</button>
                </div>
            </div>
        </div>
    </div>

    <div class="panel">
        <input id="searchBar" placeholder="VYHLEDAT ČLENA TÝMU..." style="width:100%; padding:15px; background:#000; border:2px solid #363a4f; color:white; margin-bottom:20px; box-sizing:border-box; font-weight:bold; font-style:italic;">
        <div id="teamContainer" class="team-grid"></div>
    </div>
</div>

<script>
// --- KONFIGURACE ---
const teamList = [
    { n: "Mejdrix", r: "owner" }, 
    { n: "ViriBLOX", r: "mod" },
    { n: "AdamDevRblx", r: "scripter" }, 
    { n: "Fnaffan", r: "scripter" },
    { n: "Kifír(Studio)", r: "traitor" }
];

// --- PŘIHLÁŠENÍ ---
function checkCredentials() {
    const user = document.getElementById('userInput').value.trim();
    const pass = document.getElementById('passInput').value.trim();

    // Tady je tvoje nové heslo a jméno
    if (user === "mejdrixog" && pass === "MejdrixStreamV2") {
        document.getElementById('loginOverlay').style.display = 'none';
        launchSystem();
    } else {
        document.getElementById('errorMsg').innerText = "❌ PŘÍSTUP ZAMÍTNUT: ŠPATNÉ ÚDAJE";
    }
}

// --- SYSTÉMOVÉ FUNKCE ---
function launchSystem() {
    const screen = document.getElementById('loadingScreen');
    const fill = document.getElementById('loadFill');
    const status = document.getElementById('loadStatus');
    screen.style.display = 'flex';
    
    let progress = 0;
    const interval = setInterval(() => {
        progress += 1.5;
        fill.style.width = progress + "%";
        
        if(progress > 30) status.innerText = "NAČÍTÁNÍ GRAFICKÉHO ROZHRANÍ...";
        if(progress > 70) status.innerText = "SYNCHRONIZACE S ROBLOXEM...";
        
        if(progress >= 100) {
            clearInterval(interval);
            screen.style.display = 'none';
            document.getElementById('main').style.display = 'flex';
            initializeHUD();
        }
    }, 20);
}

function initializeHUD() {
    renderTeam();
    const savedChat = localStorage.getItem('mejdrix_chat_url');
    if(savedChat) document.getElementById('tikChat').src = savedChat;
}

function updateTikFinity() {
    let val = document.getElementById('tikKey').value.trim();
    if(!val) return;
    let url = val.includes('http') ? val : `https://tikfinity.zerody.one/authed/chat/${val}`;
    localStorage.setItem('mejdrix_chat_url', url);
    document.getElementById('tikChat').src = url;
    alert("TikFinity bylo aktualizováno!");
}

function renderTeam() {
    const container = document.getElementById('teamContainer');
    const query = document.getElementById('searchBar').value.toLowerCase();
    container.innerHTML = "";
    
    teamList.filter(u => u.n.toLowerCase().includes(query)).forEach(u => {
        container.innerHTML += `
            <div class="card">
                <b style="font-size:18px;">${u.n}</b> 
                <span class="badge ${u.r}">${u.r}</span>
            </div>`;
    });
}
document.getElementById('searchBar').oninput = renderTeam;

// --- HERNÍ LOGIKA ---
let px = 200, py = 150, cx = 60, cy = 60;
const pObj = document.getElementById('player');
const cObj = document.getElementById('coin');

window.addEventListener('keydown', e => {
    const key = e.key.toLowerCase();
    const step = 20;
    
    if(['arrowup','w'].includes(key)) py -= step;
    if(['arrowdown','s'].includes(key)) py += step;
    if(['arrowleft','a'].includes(key)) px -= step;
    if(['arrowright','d'].includes(key)) px += step;

    // Hranice plochy
    px = Math.max(10, Math.min(px, 540));
    py = Math.max(10, Math.min(py, 320));

    pObj.style.left = px + "px";
    pObj.style.top = py + "px";
    
    if(document.getElementById('gameMode').value === 'coin') {
        let dist = Math.sqrt(Math.pow(px-cx, 2) + Math.pow(py-cy, 2));
        if(dist < 45) moveCoin();
    }
});

function moveCoin() {
    cx = Math.floor(Math.random() * 500) + 20;
    cy = Math.floor(Math.random() * 300) + 20;
    cObj.style.left = cx + "px";
    cObj.style.top = cy + "px";
    cObj.style.display = 'block';
}

document.getElementById('gameMode').onchange = e => {
    cObj.style.display = e.target.value === 'coin' ? 'block' : 'none';
    if(e.target.value === 'coin') moveCoin();
};
</script>
</body>
</html>
