<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEJDRIX HUD V2 - FULL SYSTEM</title>
    <style>
        :root {
            --fn-blue: #007bff; --fn-yellow: #f4c500; --fn-purple: #8c00ff;
            --fn-dark: #0a0b10; --fn-card: #1b1c26; --fn-text: #ffffff;
            --fn-green: #00ff66; --fn-pink: #ff007f; --fn-red: #ff003c;
            --fn-orange: #ffaa00; --tt-red: #fe2c55; --tt-gray: #444a59;
        }

        body {
            margin: 0; background: var(--fn-dark); color: var(--fn-text);
            font-family: 'Burbank Big Condensed', 'Segoe UI', Impact, sans-serif;
            overflow-x: hidden; min-height: 100vh;
        }

        /* --- LOGIN SCREEN --- */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1b1c26 0%, #0a0b10 100%);
            z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .login-card {
            background: var(--fn-card); padding: 40px; border: 4px solid var(--fn-yellow);
            transform: skewX(-5deg); text-align: center; box-shadow: 0 0 50px rgba(244,197,0,0.2);
        }
        .login-card input {
            display: block; width: 280px; padding: 15px; margin: 10px auto;
            background: #000; border: 2px solid #333; color: #fff; font-size: 18px; outline: none;
        }
        .login-card button {
            width: 100%; padding: 15px; background: var(--fn-yellow); color: #000;
            border: none; font-weight: 900; font-size: 20px; cursor: pointer; text-transform: uppercase;
        }

        /* --- LOADING SCREEN --- */
        #loadingScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0c0d12; z-index: 9999; display: none;
            flex-direction: column; justify-content: center; align-items: center;
        }
        .load-bar { width: 400px; height: 15px; background: #111; border: 2px solid #333; margin-top: 20px; overflow: hidden; }
        #loadFill { width: 0%; height: 100%; background: var(--fn-yellow); transition: width 0.1s; }

        /* --- MAIN CONTENT --- */
        #main { display: none; padding: 20px; max-width: 1000px; margin: 0 auto; flex-direction: column; gap: 20px; }
        
        .panel { 
            background: rgba(27, 28, 38, 0.9); border: 3px solid #2a2c3d; 
            padding: 20px; transform: skewX(-3deg); border-radius: 4px;
        }

        .game-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 15px; margin-top: 15px; }
        .canvas-area { background: #000; height: 350px; position: relative; border: 2px solid #333; overflow: hidden; }
        #player { width: 40px; height: 40px; background: var(--fn-yellow); position: absolute; border-radius: 5px; display: flex; justify-content: center; align-items: center; font-size: 24px; z-index: 10; box-shadow: 0 0 15px var(--fn-yellow); }
        #coin { position: absolute; font-size: 28px; display: none; }

        .chat-container { display: flex; flex-direction: column; height: 350px; background: #000; border: 1px solid #333; }
        iframe { flex: 1; border: none; width: 100%; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-box { background: #161720; padding: 10px; text-align: center; border: 1px solid #333; }
        .stat-val { font-size: 30px; font-weight: 900; font-style: italic; display: block; }
        
        .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
        .team-card { background: rgba(255,255,255,0.05); padding: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--fn-yellow); }
        .badge { font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 3px; text-transform: uppercase; }
        
        /* Roles */
        .owner { background: var(--fn-yellow); color: #000; }
        .mod { background: var(--fn-blue); color: #fff; }
        .scripter { background: var(--fn-purple); color: #fff; }
        .traitor { background: var(--fn-red); color: #fff; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h1 style="color: var(--fn-yellow); font-style: italic;">MEJDRIX OS LOGIN</h1>
        <input type="text" id="userInput" placeholder="JMÉNO">
        <input type="password" id="passInput" placeholder="HESLO">
        <button onclick="checkLogin()">POTVRDIT</button>
        <p id="loginError" style="color: var(--fn-red); font-weight: bold; margin-top: 10px;"></p>
    </div>
</div>

<div id="loadingScreen">
    <h1 id="loadText" style="color: var(--fn-yellow); font-style: italic;">INICIALIZACE...</h1>
    <div class="load-bar"><div id="loadFill"></div></div>
</div>

<div id="main">
    <div class="panel" style="border-color: var(--tt-red); display: flex; justify-content: space-between; align-items: center;">
        <h2 style="margin:0; font-style: italic;">🔴 MEJDRIX STREAM PANEL V2</h2>
        <div style="background: var(--tt-red); padding: 5px 15px; font-weight: 900; animation: blink 1.5s infinite;">LIVE</div>
    </div>

    <div class="panel">
        <div style="display: flex; justify-content: space-between;">
            <span style="color: var(--fn-yellow); font-weight: 900; font-size: 20px;">🕹️ TIKTOK PLAYS CHAT</span>
            <select id="mode" style="background:#000; color:#fff; border: 1px solid #444;">
                <option value="survival">SURVIVAL</option>
                <option value="coin">COIN HUNT</option>
            </select>
        </div>
        <div class="game-layout">
            <div class="canvas-area" id="stage">
                <div id="player">🤖</div>
                <div id="coin">💰</div>
            </div>
            <div class="chat-container">
                <iframe id="chatFrame" src="about:blank"></iframe>
                <div style="padding: 5px; display: flex; gap: 5px;">
                    <input id="chatKey" placeholder="Kód z TikFinity" style="flex:1; background:#111; color:#fff; border:1px solid #444;">
                    <button onclick="setChat()" style="background:var(--fn-yellow); border:none; cursor:pointer; font-weight:bold;">SET</button>
                </div>
            </div>
        </div>
    </div>

    <div class="panel">
        <div class="stats-grid">
            <div class="stat-box"><span class="stat-val" style="color: var(--fn-green);">60</span>FPS</div>
            <div class="stat-box"><span class="stat-val" style="color: var(--fn-yellow);">21ms</span>PING</div>
            <div class="stat-box"><span class="stat-val" style="color: var(--fn-blue);">512MB</span>MEM</div>
        </div>
        <input type="text" id="search" placeholder="Hledat člena týmu..." style="width:100%; padding:12px; background:#000; border:2px solid #333; color:#fff; margin-bottom:15px; box-sizing: border-box;">
        <div id="teamGrid" class="team-grid"></div>
    </div>
</div>

<script>
    const team = [
        { n: "Mejdrix", r: "owner" }, { n: "ViriBLOX", r: "mod" },
        { n: "AdamDevRblx", r: "scripter" }, { n: "Fnaffan", r: "scripter" },
        { n: "Kifír(Studio)", r: "traitor" }
    ];

    // --- LOGIN ---
    function checkLogin() {
        const u = document.getElementById('userInput').value;
        const p = document.getElementById('passInput').value;
        if (u === "mejdrixog" && p === "mejdrix streamv2") {
            document.getElementById('loginOverlay').style.display = 'none';
            runLoading();
        } else {
            document.getElementById('loginError').innerText = "❌ PŘÍSTUP ZAMÍTNUT";
        }
    }

    // --- LOADING ---
    function runLoading() {
        const screen = document.getElementById('loadingScreen');
        const fill = document.getElementById('loadFill');
        screen.style.display = 'flex';
        let p = 0;
        const int = setInterval(() => {
            p += 2;
            fill.style.width = p + "%";
            if(p >= 100) {
                clearInterval(int);
                screen.style.display = 'none';
                document.getElementById('main').style.display = 'flex';
                init();
            }
        }, 30);
    }

    // --- HUD ENGINE ---
    function init() {
        render();
        const saved = localStorage.getItem('mej_chat');
        if(saved) document.getElementById('chatFrame').src = saved;
    }

    function setChat() {
        let val = document.getElementById('chatKey').value;
        let url = val.includes('http') ? val : `https://tikfinity.zerody.one/authed/chat/${val}`;
        localStorage.setItem('mej_chat', url);
        document.getElementById('chatFrame').src = url;
    }

    function render() {
        const grid = document.getElementById('teamGrid');
        const s = document.getElementById('search').value.toLowerCase();
        grid.innerHTML = "";
        team.filter(u => u.n.toLowerCase().includes(s)).forEach(u => {
            grid.innerHTML += `<div class="team-card"><b>${u.n}</b> <span class="badge ${u.r}">${u.r}</span></div>`;
        });
    }

    document.getElementById('search').oninput = render;

    // --- GAME ENGINE ---
    let px = 200, py = 150;
    let cx = 50, cy = 50;
    const pEl = document.getElementById('player');
    const cEl = document.getElementById('coin');

    window.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if(k === 'w' || k === 'arrowup') py -= 15;
        if(k === 's' || k === 'arrowdown') py += 15;
        if(k === 'a' || k === 'arrowleft') px -= 15;
        if(k === 'd' || k === 'arrowright') px += 15;

        // Omezení pohybu
        px = Math.max(0, Math.min(px, 550));
        py = Math.max(0, Math.min(py, 300));

        pEl.style.left = px + "px";
        pEl.style.top = py + "px";

        if(document.getElementById('mode').value === 'coin') {
            let d = Math.sqrt(Math.pow(px-cx, 2) + Math.pow(py-cy, 2));
            if(d < 40) spawnCoin();
        }
    });

    function spawnCoin() {
        cx = Math.random() * 500; cy = Math.random() * 280;
        cEl.style.left = cx + "px"; cEl.style.top = cy + "px";
        cEl.style.display = 'block';
    }

    document.getElementById('mode').onchange = (e) => {
        cEl.style.display = e.target.value === 'coin' ? 'block' : 'none';
        if(e.target.value === 'coin') spawnCoin();
    };
</script>
</body>
</html>
