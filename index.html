<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEJDRIX HUD V2 - OFFICIAL</title>

<style>
:root {
    --fn-blue: #007bff; --fn-yellow: #f4c500; --fn-purple: #8c00ff;
    --fn-dark: #0a0b10; --fn-card: #1b1c26; --fn-text: #ffffff;
    --fn-green: #00ff66; --fn-red: #ff003c; --tt-red: #fe2c55;
}

body {
    margin: 0; background: var(--fn-dark); color: var(--fn-text);
    font-family: 'Burbank Big Condensed', 'Segoe UI', Impact, sans-serif;
    display: flex; justify-content: center; min-height: 100vh;
    padding: 20px; box-sizing: border-box; overflow-x: hidden;
}

/* ANIMOVANÉ POZADÍ */
body::before {
    content: ""; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(circle at 30% 30%, rgba(140, 0, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 70% 70%, rgba(0, 123, 255, 0.1) 0%, transparent 50%), var(--fn-dark);
    animation: rift 20s linear infinite; z-index: -1;
}
@keyframes rift { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* --- LOGIN SCREEN --- */
#loginOverlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(10, 11, 16, 0.98); backdrop-filter: blur(10px);
    z-index: 10000; display: flex; justify-content: center; align-items: center;
}
.login-card {
    background: var(--fn-card); padding: 50px; border: 4px solid var(--fn-yellow);
    transform: skewX(-5deg); text-align: center; box-shadow: 0 0 50px rgba(244, 197, 0, 0.3);
}
.login-card h2 { color: var(--fn-yellow); font-style: italic; font-size: 40px; margin-bottom: 30px; text-transform: uppercase; }
.login-card input {
    display: block; width: 300px; padding: 15px; margin: 15px auto;
    background: #000; border: 2px solid #363a4f; color: white; font-size: 18px; outline: none;
}
.login-card button {
    width: 100%; padding: 15px; background: var(--fn-yellow); color: black;
    border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 20px;
}

/* --- LOADING SCREEN --- */
#loadingScreen {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #0c0d12; z-index: 9999; display: none;
    flex-direction: column; justify-content: center; align-items: center;
}
.load-bar-bg { width: 400px; height: 20px; background: #111; border: 3px solid #363a4f; margin-top: 20px; overflow: hidden; }
#loadFill { width: 0%; height: 100%; background: var(--fn-yellow); }

/* --- MAIN HUD --- */
#main { display: none; width: 100%; max-width: 950px; flex-direction: column; gap: 25px; }

.panel {
    background: linear-gradient(135deg, rgba(27, 28, 38, 0.95), rgba(15, 16, 23, 0.95));
    border: 3px solid #2a2c3d; padding: 25px; transform: skewX(-3deg); border-radius: 6px;
}

.game-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
.canvas-area { background: #000; height: 350px; position: relative; border: 2px solid #333; overflow: hidden; }
#player { width: 40px; height: 40px; background: var(--fn-yellow); position: absolute; border-radius: 5px; display: flex; justify-content: center; align-items: center; font-size: 24px; box-shadow: 0 0 15px var(--fn-yellow); z-index: 10; }
#coin { position: absolute; font-size: 30px; display: none; }

.chat-box { background: #000; height: 350px; border: 2px solid #333; display: flex; flex-direction: column; }
iframe { flex: 1; border: none; }

.team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.card { background: rgba(255,255,255,0.05); padding: 15px; border-left: 5px solid var(--fn-yellow); display: flex; justify-content: space-between; align-items: center; }
.badge { padding: 4px 10px; font-weight: 900; font-size: 12px; border-radius: 3px; text-transform: uppercase; }

.owner { background: var(--fn-yellow); color: black; }
.mod { background: var(--fn-blue); color: white; }
.scripter { background: var(--fn-purple); color: white; }
</style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h2>🔒 MEJDRIX ACCESS</h2>
        <input type="text" id="uIn" placeholder="UŽIVATEL">
        <input type="password" id="pIn" placeholder="HESLO">
        <button onclick="login()">VSTOUPIT</button>
        <p id="err" style="color:var(--fn-red); font-weight:bold; margin-top:15px;"></p>
    </div>
</div>

<div id="loadingScreen">
    <h1 style="color:var(--fn-yellow); font-style:italic;">NAČÍTÁNÍ SYSTÉMU...</h1>
    <div class="load-bar-bg"><div id="loadFill"></div></div>
</div>

<div id="main">
    <div class="panel" style="border-color:var(--tt-red); display:flex; justify-content:space-between; align-items:center;">
        <h1 style="margin:0; font-style:italic;">🔴 MEJDRIX LIVE HUD V2</h1>
        <div style="background:var(--tt-red); padding:5px 15px; font-weight:900;">LIVE MONITOR</div>
    </div>

    <div class="panel">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
            <span style="color:var(--fn-yellow); font-weight:900; font-size:22px;">🕹️ TIKTOK PLAYS</span>
            <select id="gm" style="background:#000; color:white; border:1px solid #444;">
                <option value="survival">SURVIVAL</option>
                <option value="coin">COIN HUNT</option>
            </select>
        </div>
        <div class="game-layout">
            <div class="canvas-area" id="stage">
                <div id="player">🤖</div>
                <div id="coin">💰</div>
            </div>
            <div class="chat-box">
                <iframe id="chat" src="about:blank"></iframe>
                <div style="padding:5px; display:flex; gap:5px;">
                    <input id="key" placeholder="TikFinity ID" style="flex:1; background:#111; color:white; border:1px solid #444;">
                    <button onclick="setChat()" style="background:var(--fn-yellow); border:none; padding:5px; font-weight:bold; cursor:pointer;">OK</button>
                </div>
            </div>
        </div>
    </div>

    <div class="panel">
        <input id="search" placeholder="HLEDAT V TÝMU..." style="width:100%; padding:15px; background:#000; border:2px solid #333; color:white; margin-bottom:20px; box-sizing:border-box;">
        <div id="grid" class="team-grid"></div>
    </div>
</div>

<script>
const team = [
    { n: "Mejdrix", r: "owner" }, { n: "ViriBLOX", r: "mod" },
    { n: "AdamDevRblx", r: "scripter" }, { n: "Fnaffan", r: "scripter" },
    { n: "Kifír(Studio)", r: "traitor" }
];

function login() {
    const u = document.getElementById('uIn').value;
    const p = document.getElementById('pIn').value;
    // NOVÉ HESLO A JMÉNO ZDE:
    if (u === "mejdrixog" && p === "MejdrixStreamV2") {
        document.getElementById('loginOverlay').style.display = 'none';
        startLoad();
    } else {
        document.getElementById('err').innerText = "❌ ŠPATNÉ ÚDAJE";
    }
}

function startLoad() {
    const s = document.getElementById('loadingScreen');
    const f = document.getElementById('loadFill');
    s.style.display = 'flex';
    let prg = 0;
    const i = setInterval(() => {
        prg += 2;
        f.style.width = prg + "%";
        if(prg >= 100) {
            clearInterval(i);
            s.style.display = 'none';
            document.getElementById('main').style.display = 'flex';
            init();
        }
    }, 25);
}

function init() {
    render();
    const s = localStorage.getItem('m_chat');
    if(s) document.getElementById('chat').src = s;
}

function setChat() {
    let v = document.getElementById('key').value;
    let url = v.includes('http') ? v : `https://tikfinity.zerody.one/authed/chat/${v}`;
    localStorage.setItem('m_chat', url);
    document.getElementById('chat').src = url;
}

function render() {
    const g = document.getElementById('grid');
    const s = document.getElementById('search').value.toLowerCase();
    g.innerHTML = "";
    team.filter(x => x.n.toLowerCase().includes(s)).forEach(x => {
        g.innerHTML += `<div class="card"><b>${x.n}</b> <span class="badge ${x.r}">${x.r}</span></div>`;
    });
}
document.getElementById('search').oninput = render;

// HRA
let px = 100, py = 100, cx = 50, cy = 50;
const pEl = document.getElementById('player');
const cEl = document.getElementById('coin');

window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if(k === 'w' || k === 'arrowup') py -= 20;
    if(k === 's' || k === 'arrowdown') py += 20;
    if(k === 'a' || k === 'arrowleft') px -= 20;
    if(k === 'd' || k === 'arrowright') px += 20;
    pEl.style.left = px + "px"; pEl.style.top = py + "px";
    
    if(document.getElementById('gm').value === 'coin') {
        if(Math.sqrt(Math.pow(px-cx,2)+Math.pow(py-cy,2)) < 40) spawn();
    }
});

function spawn() {
    cx = Math.random()*500; cy = Math.random()*300;
    cEl.style.left = cx+"px"; cEl.style.top = cy+"px";
    cEl.style.display = 'block';
}

document.getElementById('gm').onchange = e => {
    cEl.style.display = e.target.value === 'coin' ? 'block' : 'none';
    if(e.target.value === 'coin') spawn();
};
</script>
</body>
</html>
