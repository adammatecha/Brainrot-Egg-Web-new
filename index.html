<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEJDRIX HUD V2 - TIKFINITY INTEGRATION</title>

<style>
:root {
    --fn-blue: #007bff;
    --fn-yellow: #f4c500;
    --fn-purple: #8c00ff;
    --fn-dark: #0a0b10;
    --fn-card: #1b1c26;
    --fn-text: #ffffff;
    --fn-green: #00ff66;
    --fn-pink: #ff007f;
    --fn-red: #ff003c;
    --fn-orange: #ffaa00;
    --tt-red: #fe2c55;
    --tt-gray: #444a59;
    --yt-color: #ff0000;
    --dc-color: #5865f2;
    --rbx-color: #2b2d32;
}

body {
    margin: 0;
    background: var(--fn-dark);
    color: var(--fn-text);
    font-family: 'Burbank Big Condensed', 'Segoe UI', Impact, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
}

/* --- LOGIN SCREEN --- */
#loginOverlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: radial-gradient(circle at center, #1b1c26 0%, #0a0b10 100%);
    z-index: 10002;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}
.login-card {
    background: var(--fn-card);
    padding: 50px;
    border: 4px solid var(--fn-yellow);
    transform: skewX(-5deg);
    text-align: center;
    box-shadow: 0 0 50px rgba(244, 197, 0, 0.2);
}
.login-card h2 { color: var(--fn-yellow); font-style: italic; font-size: 40px; margin-bottom: 30px; text-transform: uppercase; }
.login-card input {
    display: block; width: 300px; padding: 15px; margin: 15px auto;
    background: #000; border: 2px solid #363a4f; color: white;
    font-family: inherit; font-size: 18px; outline: none;
}
.login-card button {
    width: 100%; padding: 15px; background: var(--fn-yellow); color: black;
    border: none; font-weight: 900; cursor: pointer; text-transform: uppercase;
    font-size: 20px; transition: transform 0.1s;
}
.login-card button:active { transform: scale(0.95); }

/* --- LOADING SCREEN --- */
#loadingScreen {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: #0c0d12;
    z-index: 10001;
    display: none; /* Ukáže se až po loginu */
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

/* --- MAIN CONTENT --- */
#main {
    display: none;
    width: 100%;
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
    flex-direction: column;
    gap: 30px;
}

/* UNIFORM PANELS */
.panel {
    background: linear-gradient(135deg, rgba(27, 28, 38, 0.95), rgba(15, 16, 23, 0.95));
    border: 3px solid #2a2c3d;
    border-radius: 6px;
    padding: 25px;
    transform: skewX(-3deg);
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
}

.game-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px; }
.canvas-area { background: #000; height: 400px; position: relative; border: 2px solid #363a4f; overflow: hidden; border-radius: 4px; }
#player { width: 44px; height: 44px; background: var(--fn-yellow); border-radius: 6px; position: absolute; box-shadow: 0 0 15px var(--fn-yellow); display: flex; justify-content: center; align-items: center; font-size: 26px; z-index: 5; }
#coin { position: absolute; font-size: 30px; display: none; animation: blink 1s infinite; }

.chat-box { background: rgba(0,0,0,0.5); height: 400px; border: 2px solid #363a4f; display: flex; flex-direction: column; border-radius: 4px; overflow: hidden; }
.iframe-wrap { flex: 1; width: 100%; height: 100%; }

/* STATS & GRID */
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
.stat-box { background: #1b1c26; border: 2px solid #363a4f; padding: 15px; text-align: center; }
.stat-val { font-size: 35px; font-weight: 900; font-style: italic; display: block; }

#teamGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
.card { background: rgba(255,255,255,0.05); padding: 15px; border-left: 5px solid var(--fn-yellow); display: flex; justify-content: space-between; align-items: center; }
.badge { padding: 5px 10px; font-weight: 900; font-size: 12px; border-radius: 3px; text-transform: uppercase; }

/* ROLES */
.owner { background: var(--fn-yellow); color: black; }
.mod { background: var(--fn-blue); color: white; }
.scripter { background: var(--fn-purple); color: white; }

@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
@keyframes pulsate { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
</style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h2>🔒 MEJDRIX SYSTEM</h2>
        <input type="text" id="userIn" placeholder="UŽIVATELSKÉ JMÉNO">
        <input type="password" id="passIn" placeholder="HESLO">
        <button onclick="tryLogin()">PŘIHLÁSIT SE</button>
        <p id="errorMsg" style="color: var(--fn-red); font-weight: bold; margin-top: 20px;"></p>
    </div>
</div>

<div id="loadingScreen">
    <h1 style="color:var(--fn-yellow); font-size: 60px; font-style:italic; animation: pulsate 1s infinite;">NAČÍTÁNÍ...</h1>
    <div style="width: 400px; height: 15px; background: #12131a; border: 3px solid #363a4f; margin-top: 20px; border-radius: 10px; overflow: hidden;">
        <div id="loadFill" style="width: 0%; height: 100%; background: var(--fn-yellow); transition: width 0.1s;"></div>
    </div>
</div>

<div id="main">
    <div class="panel" style="border-color: var(--tt-red); display: flex; justify-content: space-between; align-items: center;">
        <h1 style="margin:0; font-style:italic; letter-spacing: 2px;">🔴 MEJDRIX LIVE MONITOR V2</h1>
        <div style="background: var(--tt-red); padding: 5px 15px; font-weight: 900; border-radius: 4px;">LIVE</div>
    </div>

    <div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <span style="color:var(--fn-yellow); font-weight:900; font-size:24px;">🕹️ TIKTOK PLAYS & CHAT</span>
            <select id="gameMode" style="background:#000; color:white; border:2px solid #363a4f; padding:8px; font-weight:900;">
                <option value="survival">SURVIVAL MODE</option>
                <option value="coin">COIN HUNT</option>
            </select>
        </div>
        
        <div class="game-layout">
            <div class="canvas-area" id="stage">
                <div id="player">🤖</div>
                <div id="coin">💰</div>
            </div>
            <div class="chat-box">
                <div style="padding:10px; text-align:center; font-weight:bold; border-bottom:1px solid #333;">TIKFINITY OVERLAY</div>
                <div class="iframe-wrap">
                    <iframe id="chatFrame" src="about:blank" style="width:100%; height:100%; border:none;"></iframe>
                </div>
                <div style="padding:10px; display:flex; gap:5px;">
                    <input id="chatUrl" placeholder="Vlož kód..." style="flex:1; background:#111; border:1px solid #444; color:white; padding:5px;">
                    <button onclick="saveChat()" style="background:var(--fn-yellow); border:none; padding:5px 10px; cursor:pointer; font-weight:bold;">OK</button>
                </div>
            </div>
        </div>
    </div>

    <div class="panel">
        <div class="stats-grid">
            <div class="stat-box"><span class="stat-val" style="color:var(--fn-green)">60</span>FPS</div>
            <div class="stat-box"><span class="stat-val" style="color:var(--fn-yellow)">24ms</span>PING</div>
            <div class="stat-box"><span class="stat-val" style="color:var(--fn-blue)">485MB</span>RAM</div>
        </div>
        <input type="text" id="search" placeholder="HLEDAT ČLENA TÝMU..." style="width:100%; padding:15px; background:#000; border:2px solid #363a4f; color:white; font-size:18px; margin-bottom:20px; outline:none;">
        <div id="teamGrid"></div>
    </div>
</div>

<script>
// --- KONFIGURACE ---
const USERS_DATA = [
    { name: "Mejdrix", role: "owner" },
    { name: "ViriBLOX", role: "mod" },
    { name: "AdamDevRblx", role: "scripter" },
    { name: "Fnaffan", role: "scripter" },
    { name: "Kifír(Studio)", role: "traitor" }
];

// --- LOGIN LOGIKA ---
function tryLogin() {
    const u = document.getElementById('userIn').value;
    const p = document.getElementById('passIn').value;
    const err = document.getElementById('errorMsg');

    if (u === "mejdrixog" && p === "mejdrix streamv2") {
        document.getElementById('loginOverlay').style.display = 'none';
        startLoading();
    } else {
        err.innerText = "❌ NESPRÁVNÉ ÚDAJE!";
    }
}

// --- LOADING LOGIKA ---
function startLoading() {
    const screen = document.getElementById('loadingScreen');
    const fill = document.getElementById('loadFill');
    const main = document.getElementById('main');
    screen.style.display = 'flex';

    let prg = 0;
    const timer = setInterval(() => {
        prg += 2;
        fill.style.width = prg + "%";
        if (prg >= 100) {
            clearInterval(timer);
            setTimeout(() => {
                screen.style.display = 'none';
                main.style.display = 'flex';
                initHUD();
            }, 500);
        }
    }, 30);
}

// --- HUD LOGIKA ---
function initHUD() {
    renderUsers();
    loadChat();
}

function saveChat() {
    let val = document.getElementById('chatUrl').value;
    let url = val.startsWith('http') ? val : `https://tikfinity.zerody.one/authed/chat/${val}`;
    localStorage.setItem('mejdrix_chat', url);
    document.getElementById('chatFrame').src = url;
}

function loadChat() {
    let saved = localStorage.getItem('mejdrix_chat');
    if(saved) {
        document.getElementById('chatFrame').src = saved;
        document.getElementById('chatUrl').value = saved;
    }
}

function renderUsers() {
    const grid = document.getElementById('teamGrid');
    const s = document.getElementById('search').value.toLowerCase();
    grid.innerHTML = "";

    USERS_DATA.filter(u => u.name.toLowerCase().includes(s)).forEach(u => {
        grid.innerHTML += `
            <div class="card">
                <span style="font-weight:900; font-size:20px;">${u.name}</span>
                <span class="badge ${u.role}">${u.role}</span>
            </div>
        `;
    });
}

document.getElementById('search').oninput = renderUsers;

// --- HRA ---
let px = 50, py = 50;
let cx = 150, cy = 150;
const pEl = document.getElementById('player');
const cEl = document.getElementById('coin');

window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if(k === 'w' || k === 'arrowup') py -= 20;
    if(k === 's' || k === 'arrowdown') py += 20;
    if(k === 'a' || k === 'arrowleft') px -= 20;
    if(k === 'd' || k === 'arrowright') px += 20;

    pEl.style.left = px + "px";
    pEl.style.top = py + "px";

    if(document.getElementById('gameMode').value === 'coin') {
        let d = Math.sqrt(Math.pow(px-cx,2) + Math.pow(py-cy,2));
        if(d < 40) {
            cx = Math.random() * 300; cy = Math.random() * 300;
            cEl.style.left = cx + "px"; cEl.style.top = cy + "px";
            cEl.style.display = 'block';
        }
    }
});

document.getElementById('gameMode').onchange = (e) => {
    cEl.style.display = e.target.value === 'coin' ? 'block' : 'none';
};
</script>
</body>
</html>
